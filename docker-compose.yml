services:
  detection-page:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.12-slim-bookworm
        WORKDIR /app
        COPY tests/fixtures/detection_page /app
        EXPOSE 8090
        CMD ["python", "serve.py"]
    ports:
      - "8090:8090"

  # gateway+worker (each with a purpose-built image) is the only topology
  # this file offers -- `monolith` (one process, no HTTP hop to itself) is
  # still a valid `BAAS_ROLE` for non-Docker use (`uv run uvicorn` locally,
  # and this repo's own test suite), just no longer a compose service.
  #
  # Neither Redis nor Postgres is a service in this file. Both are run by
  # the operator on their own host machine -- exactly how Firecrawl treats
  # Supabase (a connection-string env var, no container) -- reached from
  # inside these containers via `host.docker.internal`. Bring up your own
  # before `docker compose up`, e.g.:
  #   brew install redis postgresql@16 && brew services start redis postgresql@16
  # then set BAAS_REDIS_URL / BAAS_DATABASE_URL below (a real `.env` file in
  # the repo root, gitignored, is picked up automatically by compose's
  # `${VAR:-}` substitution -- see `.env.example`).

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    # Google ships official Chrome (`channel="chrome"`) for linux/amd64 only --
    # `patchright install chrome` hard-fails on linux/arm64 ("not supported").
    # The fleet targets amd64 cloud nodes anyway (locked-in decision: real
    # Chrome, not Chromium, for sandbox fidelity), so this is pinned rather
    # than silently falling back to Chromium on arm64 dev machines (e.g.
    # Apple Silicon) -- expect Docker Desktop to emulate via Rosetta/QEMU
    # locally, which is slower but architecturally correct.
    platform: linux/amd64
    cap_add:
      - SYS_ADMIN # real Chrome sandbox (not --no-sandbox) -- untrusted third-party
      # pages on a shared multi-tenant node need process-level isolation.
      - NET_ADMIN # baas.egress.policy applies real iptables rules in this
      # container's own netns (metadata + RFC1918 baseline).
    shm_size: "2gb"
    volumes:
      - profiles:/var/lib/baas/profiles
      - vault:/var/lib/baas/vault
    extra_hosts:
      - "host.docker.internal:host-gateway" # lets Linux Docker hosts resolve it too
    environment:
      BAAS_ROLE: worker
      BAAS_PROFILES_DIR: /var/lib/baas/profiles
      # Registry/proxy-pinning degrade to in-memory/disabled if left unset,
      # but the split topology only makes sense with a real, shared Redis
      # both worker and gateway point at, e.g.:
      #   BAAS_REDIS_URL=redis://host.docker.internal:6379/0
      BAAS_REDIS_URL: ${BAAS_REDIS_URL:-}
      BAAS_VAULT_DIR: /var/lib/baas/vault
      BAAS_VAULT_KEY: ${BAAS_VAULT_KEY:-} # unset -> vault disabled (no encryption-at-rest key configured)
    depends_on:
      - detection-page
    # No published port -- internal-only, VPC-bound, never tenant-exposed
    # per plan.md's topology; only the `gateway` service talks to it.

  gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    # No `platform: linux/amd64` pin -- no Chrome, runs natively on arm64.
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BAAS_ROLE: gateway
      # Required, not optional, for this role -- _init_gateway() already
      # raises if unset, since the cross-process session-routing table has
      # no fallback. Same operator-run-Redis expectation as worker above.
      BAAS_REDIS_URL: ${BAAS_REDIS_URL:-}
      BAAS_WORKER_URL: http://worker:8000
      # Gates `/v1/api-keys` (issuing/revoking tenant API keys) and nothing
      # else -- unset means that control-plane surface 401s unconditionally
      # (fails closed), not that auth is disabled fleet-wide.
      BAAS_ADMIN_TOKEN: ${BAAS_ADMIN_TOKEN:-}
      # No `postgres` service exists here by design -- Postgres is an
      # external, unmanaged-by-compose dependency you run yourself, exactly
      # how Firecrawl treats Supabase. Unset -> falls back to an in-memory
      # key store (dev-only, doesn't survive a restart, not shared across
      # replicas). Point at a real Postgres you've already run `alembic
      # upgrade head` against:
      #   BAAS_DATABASE_URL=postgresql://baas:baas@host.docker.internal:5432/baas
      BAAS_DATABASE_URL: ${BAAS_DATABASE_URL:-}
    depends_on:
      - worker

volumes:
  profiles:
  vault:
