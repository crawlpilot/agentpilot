services:
  detection-page:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.12-slim-bookworm
        WORKDIR /app
        COPY tests/fixtures/detection_page /app
        EXPOSE 8090
        CMD ["python", "serve.py"]
    ports:
      - "8090:8090"

  # gateway+worker (each with a purpose-built image) is the only process
  # topology -- `AGENTPILOT_ROLE` is `gateway` or `worker`, nothing else. Two
  # worker services (worker, worker-2) so multi-worker placement is actually
  # demonstrable locally, not just unit-tested -- each self-registers into the
  # fleet under its own AGENTPILOT_NODE_ADDR; the gateway discovers both via
  # Redis, not via any compose-level service name, so this isn't relying on
  # Compose's (unreliable) DNS round-robin for scaling.
  #
  # Redis and Postgres run as compose services too (below), each on its own
  # named volume -- not host-installed. Reaching host-bound services from
  # inside a container needs either the host's application firewall opened
  # up per-process or a non-default bind address, both of which are a worse
  # tradeoff for local dev than just running them here, on the same internal
  # network as worker/gateway, with no host exposure at all.

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379" # loopback-only, so you can still redis-cli/psql from the host for debugging/migrations

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agentpilot
      POSTGRES_PASSWORD: agentpilot
      POSTGRES_DB: agentpilot
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # loopback-only, so you can still redis-cli/psql from the host for debugging/migrations
    # Gates the `migrate` job (and, transitively, the app services) so schema
    # changes only run against a Postgres that's actually accepting connections
    # -- not merely "container started".
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentpilot -d agentpilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot schema migrator: runs `alembic upgrade head` and exits. Every app
  # service below `depends_on` it with `service_completed_successfully`, so a
  # `docker compose up` always brings the DB to head *before* any worker or the
  # gateway serves a request -- the standard "migrations are a deploy step, not
  # a manual afterthought" pattern. Re-running when already at head is a fast
  # no-op. Deliberately NOT run inside the app process: three replicas
  # (worker, worker-2, gateway) would otherwise race the same DDL on boot.
  # Uses the lean gateway image (has alembic + alembic/ + no Chrome).
  migrate:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    # `--no-sync` for the same reason as the gateway CMD it shares an image with:
    # `alembic` comes from that image's `--extra postgres`, and a bare `uv run`
    # re-syncs at start without that extra -- so the migrator was re-resolving
    # (and rebuilding the workspace wheels) before every `alembic upgrade head`.
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    environment:
      AGENTPILOT_DATABASE_URL: postgresql://agentpilot:agentpilot@postgres:5432/agentpilot
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # Build-only base image (Debian + Chrome + Python deps) -- the heavy,
  # slow-changing half of the worker image. Gated behind the `base` profile so
  # `docker compose up` never starts it as a container; it's built on demand as
  # the `base` build-context for `worker`/`worker-2` (see their
  # `build.additional_contexts` below), so a code change rebuilds only the thin
  # worker code layer, never Chrome. Rebuild explicitly after a dependency
  # change with: `docker compose build worker-base`.
  worker-base:
    build:
      context: .
      dockerfile: docker/worker-base.Dockerfile
      # Explicit build platform: Chrome (channel=chrome) is amd64-only, so the
      # base MUST build for linux/amd64 even on an arm64 host (emulated via
      # QEMU). Set here under `build:` -- not just the service-level `platform`
      # -- so `docker compose build worker-base` targets amd64 regardless.
      platforms:
        - linux/amd64
    image: crawlpilot/worker-base:latest
    platform: linux/amd64
    profiles: ["base"]

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      # Wires the prebuilt base image in as the `FROM base` context. Build the
      # base first (once, and after any dependency change):
      #   docker compose build worker-base      # or: make base
      # then a normal `docker compose up -d --build` rebuilds only the worker
      # code layer on top -- Chrome never rebuilds for a code change.
      additional_contexts:
        base: "docker-image://crawlpilot/worker-base:latest"
    # Google ships official Chrome (`channel="chrome"`) for linux/amd64 only --
    # `patchright install chrome` hard-fails on linux/arm64 ("not supported").
    # The fleet targets amd64 cloud nodes anyway (locked-in decision: real
    # Chrome, not Chromium, for sandbox fidelity), so this is pinned rather
    # than silently falling back to Chromium on arm64 dev machines (e.g.
    # Apple Silicon) -- expect Docker Desktop to emulate via Rosetta/QEMU
    # locally, which is slower but architecturally correct.
    platform: linux/amd64
    cap_add:
      - SYS_ADMIN # real Chrome sandbox (not --no-sandbox) -- untrusted third-party
      # pages on a shared multi-tenant node need process-level isolation.
      - NET_ADMIN # agentpilot.egress.policy applies real iptables rules in this
      # container's own netns (metadata + RFC1918 baseline).
    shm_size: "2gb"
    # A browser node is sized by MEMORY, not by CPU, and nothing here was
    # sized at all: both workers ran on the defaults, which allow 25 contexts
    # each. A Chrome context is a process TREE of 300 MB-1 GB, so two workers
    # were entitled to 50 browsers -- call it 15-50 GB -- on a 7.65 GB host.
    #
    # MEASURED: 133 Chrome processes across the two workers holding 6.7 of
    # 7.65 GB, at which point a tab died with `page_crash` mid-build. The
    # reaper could not help: it evicts IDLE contexts and under sustained load
    # there are none, and its per-process ceiling was read against Chrome's
    # ROOT process (~290 MB) rather than the tree, so 4096 MB was unreachable.
    #
    # `mem_limit` is the backstop Docker enforces regardless of what the app
    # believes. Without it the container's `memory.max` is literally "max" and
    # `/proc/meminfo` reports the whole host, so the app's own watermark is
    # measuring a number nobody is bounding.
    mem_limit: ${AGENTPILOT_WORKER_MEM_LIMIT:-3g}
    volumes:
      - profiles:/var/lib/agentpilot/profiles
      - vault:/var/lib/agentpilot/vault
    environment:
      AGENTPILOT_ROLE: worker
      AGENTPILOT_PROFILES_DIR: /var/lib/agentpilot/profiles
      AGENTPILOT_REDIS_URL: redis://redis:6379/0
      AGENTPILOT_VAULT_DIR: /var/lib/agentpilot/vault
      AGENTPILOT_VAULT_KEY: ${AGENTPILOT_VAULT_KEY:-} # unset -> vault disabled (no encryption-at-rest key configured)
      # The address the gateway reaches *this* worker at -- required once
      # AGENTPILOT_REDIS_URL is set (the worker self-registers into the
      # fleet at boot; see agentpilot/placement/node_registry.py). Left
      # unset here would mean the gateway can never place a session on this
      # node, so wiring.py fails fast at startup instead.
      AGENTPILOT_NODE_ADDR: http://worker:8000
      # Sized to `mem_limit` above rather than left on the defaults. Four
      # contexts at ~600 MB of tree apiece fits 3 GB with room for the
      # interpreter; 25 (the default) does not fit any machine this compose
      # file would run on.
      #
      # This number only started binding the workers when `wiring.py` began
      # passing it to `session.admission.NodeAdmission`. Before that it was
      # advertised to the gateway's placer and enforced nowhere else -- and
      # `recipe_worker_loop` opens its browser in-process, deliberately
      # bypassing the placer, so the workload that actually filled the host was
      # the one nothing counted.
      AGENTPILOT_MAX_CONTEXTS_PER_NODE: ${AGENTPILOT_MAX_CONTEXTS_PER_NODE:-4}
      # Now that the ceiling is measured across the process tree
      # (`reaper.read_tree_rss_mb`) it is a number a real browser can reach,
      # so it has to be a real budget rather than a formality.
      AGENTPILOT_PER_PROCESS_CEILING_MB: ${AGENTPILOT_PER_PROCESS_CEILING_MB:-1200}
      # Warm profiles are an anti-detection feature and worth keeping, but not
      # for five minutes on a node this size -- that is most of a build.
      AGENTPILOT_IDLE_TTL_SECONDS: ${AGENTPILOT_IDLE_TTL_SECONDS:-120}
      AGENTPILOT_REAPER_INTERVAL_SECONDS: ${AGENTPILOT_REAPER_INTERVAL_SECONDS:-10}
      # Needed for _connect_jobs_store()/_connect_agent_store()/
      # _connect_recipe_store() to run CrawlWorkerLoop/AgentWorkerLoop/
      # RecipeWorkerLoop on this process -- previously unset here (only
      # `gateway` had it), so queued crawl/agent/recipe runs sat `queued`
      # forever, never claimed.
      AGENTPILOT_DATABASE_URL: postgresql://agentpilot:agentpilot@postgres:5432/agentpilot
      # LLM config for the agent loop (agent_worker_loop -> run_agent_loop ->
      # LLMConfig.from_env()). Passed through from your shell/.env -- the app
      # never dotenv-loads, and Compose only injects vars the `environment`
      # block names, so these MUST be listed here to reach the container.
      # For a host Ollama, point BASE_URL at `http://host.docker.internal:11434/v1`
      # (NOT localhost -- that's the container itself), API_KEY any non-empty
      # string (Ollama ignores it; LLMConfig just requires it set).
      AGENTPILOT_LLM_API_KEY: ${AGENTPILOT_LLM_API_KEY:-}
      AGENTPILOT_LLM_BASE_URL: ${AGENTPILOT_LLM_BASE_URL:-}
      AGENTPILOT_LLM_MODEL: ${AGENTPILOT_LLM_MODEL:-}
      AGENTPILOT_LLM_TIMEOUT_S: ${AGENTPILOT_LLM_TIMEOUT_S:-}
      # `bedrock` swaps the OpenAI-compatible backend for Claude in Amazon
      # Bedrock (agentpilot.llm.bedrock). The image must then carry the
      # `bedrock` extra -- see docker/worker.Dockerfile.
      AGENTPILOT_LLM_PROVIDER: ${AGENTPILOT_LLM_PROVIDER:-}
      AGENTPILOT_LLM_AWS_REGION: ${AGENTPILOT_LLM_AWS_REGION:-}
      AGENTPILOT_LLM_MAX_TOKENS: ${AGENTPILOT_LLM_MAX_TOKENS:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      # SigV4 path (no bearer token): the standard AWS credential chain.
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      # Proxy pools for the anti-detection tiers (see README "Anti-detection,
      # tiers & proxies"). Passed through from your shell/.env; empty by default
      # -> egress uses the container IP and tier=stealth|enhanced fail closed.
      # Point AGENTPILOT_PROXY_POOL(S) at a RESIDENTIAL/MOBILE pool for hardened
      # targets (Akamai/PerimeterX/DataDome).
      AGENTPILOT_PROXY_POOL: ${AGENTPILOT_PROXY_POOL:-}
      AGENTPILOT_PROXY_POOLS: ${AGENTPILOT_PROXY_POOLS:-}
      AGENTPILOT_PROXY_MAX_SUCCESS: ${AGENTPILOT_PROXY_MAX_SUCCESS:-}
      # Left unset deliberately -- AGENTPILOT_NODE_ID defaults to hostname
      # + a fresh uuid suffix per container start, so a restarted node never
      # advertises a stale node_id whose addr might have changed. Don't pin
      # this to a stable value without re-reading agentpilot/gateway/
      # routing.py's docstring on why node_id -> addr stays a live lookup.
    depends_on:
      detection-page:
        condition: service_started
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      # Don't claim/process runs until the schema is at head -- otherwise the
      # worker loops query columns a stale DB doesn't have yet.
      migrate:
        condition: service_completed_successfully
    # No published port -- internal-only, VPC-bound, never tenant-exposed
    # per plan.md's topology; only the `gateway` service talks to it.

  worker-2:
    extends:
      service: worker
    volumes:
      - profiles-2:/var/lib/agentpilot/profiles
      - vault-2:/var/lib/agentpilot/vault
    environment:
      AGENTPILOT_ROLE: worker
      AGENTPILOT_PROFILES_DIR: /var/lib/agentpilot/profiles
      AGENTPILOT_REDIS_URL: redis://redis:6379/0
      AGENTPILOT_VAULT_DIR: /var/lib/agentpilot/vault
      AGENTPILOT_VAULT_KEY: ${AGENTPILOT_VAULT_KEY:-}
      AGENTPILOT_NODE_ADDR: http://worker-2:8000
      # The memory limits are NOT restated here: `extends` merges the
      # environment rather than replacing it, so worker-2 inherits every
      # `AGENTPILOT_*` above. Verified against `docker compose config`, which
      # resolves this service with MAX_CONTEXTS_PER_NODE=4 and the
      # DATABASE_URL it never names either.
      #
      # `mem_limit` is inherited the same way, and that is the part worth
      # checking after any edit: two workers at 3g each, plus the host, is
      # what the 7.65 GB this runs on can actually carry.
      AGENTPILOT_DATABASE_URL: postgresql://agentpilot:agentpilot@postgres:5432/agentpilot
      AGENTPILOT_PROXY_POOL: ${AGENTPILOT_PROXY_POOL:-}
      AGENTPILOT_PROXY_POOLS: ${AGENTPILOT_PROXY_POOLS:-}
      AGENTPILOT_PROXY_MAX_SUCCESS: ${AGENTPILOT_PROXY_MAX_SUCCESS:-}

  gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    # No `platform: linux/amd64` pin -- no Chrome, runs natively on arm64.
    ports:
      - "8000:8000"
    environment:
      AGENTPILOT_ROLE: gateway
      AGENTPILOT_REDIS_URL: redis://redis:6379/0
      # No AGENTPILOT_WORKER_URL -- placement is real now (agentpilot.
      # placement.placer.SessionPlacer), discovering live workers via Redis
      # (each worker self-registers at boot), not a fixed configured target.
      # Gates `/v1/api-keys` (issuing/revoking tenant API keys) and nothing
      # else -- unset means that control-plane surface 401s unconditionally
      # (fails closed), not that auth is disabled fleet-wide.
      AGENTPILOT_ADMIN_TOKEN: ${AGENTPILOT_ADMIN_TOKEN:-}
      AGENTPILOT_DATABASE_URL: postgresql://agentpilot:agentpilot@postgres:5432/agentpilot
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_started
      worker-2:
        condition: service_started

volumes:
  profiles:
  vault:
  profiles-2:
  vault-2:
  redis-data:
  postgres-data:
