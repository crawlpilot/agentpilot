[project]
name = "agentpilot"
version = "0.1.0"
description = "Multi-tenant Browser-as-a-Service platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Rahul Bisht", email = "rahulbisht1694@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "prometheus-client>=0.21",
    "structlog>=24.4",
    "redis>=5.0",
    "httpx>=0.27",
    "websockets>=13.0",
]

[project.urls]
Repository = "https://github.com/crawlpilot/agentpilot"
Issues = "https://github.com/crawlpilot/agentpilot/issues"

[project.optional-dependencies]
# Chrome-adjacent packages -- only ever imported by agentpilot.driver,
# agentpilot.extraction, and agentpilot.identity.vault's Fernet encryption. Needed by
# `AGENTPILOT_ROLE=worker` (and `monolith`, run outside Docker) -- never installed
# in docker/gateway.Dockerfile's image, which is the whole point of the
# split (a genuinely Chrome-free gateway image).
driver = [
    "patchright>=1.61.2",
    "re-cdp-patches>=0.9.1",
    "lxml>=6.1.1",
    "cssselect>=1.2.0",
    "cryptography>=43.0",
]
# Postgres driver (runtime pool) + Alembic (migrations) for agentpilot.auth
# .store.PostgresApiKeyStore. Needed by `monolith`/`gateway` (both mount
# tenant-facing auth-gated routes) -- not `worker`, which never touches
# wiring.api_keys.
postgres = [
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.13",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-httpserver>=1.1",
    "fakeredis>=2.26",
    "lupa>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentpilot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's `Depends(...)` in argument defaults is the framework's own
# dependency-injection idiom, not the mutable-default-argument bug B008 exists
# to catch -- false positive on every route in agentpilot.gateway.routes.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = false

[[tool.mypy.overrides]]
module = ["agentpilot.spi.*", "agentpilot.driver.*", "agentpilot.identity.*", "agentpilot.session.*", "agentpilot.auth.*", "agentpilot.jobs.*", "agentpilot.crawl.*"]
strict = true

[tool.importlinter]
root_package = "agentpilot"

# agentpilot.placement/control are still P3+/future packages that don't exist yet
# -- wrapped in parentheses per import-linter's "optional layer" syntax so
# these contracts are already correct once those packages land, without
# breaking `lint-imports` today. agentpilot.session landed in P1 and agentpilot.identity
# lands in P2, so neither is parenthesized anymore.
[[tool.importlinter.contracts]]
name = "gateway -> session -> identity -> auth -> spi"
type = "layers"
layers = ["agentpilot.gateway", "agentpilot.session", "agentpilot.identity", "agentpilot.auth", "agentpilot.spi"]

[[tool.importlinter.contracts]]
name = "gateway -> placement -> spi"
type = "layers"
layers = ["agentpilot.gateway", "(agentpilot.placement)", "agentpilot.spi"]

[[tool.importlinter.contracts]]
name = "gateway -> control -> spi"
type = "layers"
layers = ["agentpilot.gateway", "(agentpilot.control)", "agentpilot.spi"]

[[tool.importlinter.contracts]]
name = "driver -> {extraction, egress} -> spi"
type = "layers"
layers = ["agentpilot.driver", "agentpilot.extraction | agentpilot.egress", "agentpilot.spi"]

# agentpilot.jobs (the async job queue behind /v1/crawl and /v1/batch/scrape)
# is a second top-level consumer of agentpilot.placement, alongside
# agentpilot.gateway -- the same shape placement already supports, not a
# layering violation. agentpilot.crawl is now real (routes/map.py calls it
# directly, no worker hop needed since it's pure guarded-HTTP discovery, no
# driver) and is itself a second top-level consumer, of both gateway and
# jobs -- same shape again. The crawl-worker processing loop
# (agentpilot.jobs.worker_loop) is folded into the existing `worker` role
# (a deliberate P4 choice -- no separate role/HTTP hop) and so needs
# agentpilot.session/agentpilot.identity directly, the same way gateway's own
# routes do, to run agentpilot.session.ephemeral.run_ephemeral_scrape locally
# -- jobs is now that chain's second top-level consumer too. agentpilot.webhook
# is still a future package (webhook delivery, not yet built) -- wrapped in
# parentheses per import-linter's "optional layer" syntax, same idiom this
# file already used for placement/control before they existed.

[[tool.importlinter.contracts]]
name = "gateway -> jobs -> spi"
type = "layers"
layers = ["agentpilot.gateway", "agentpilot.jobs", "agentpilot.spi"]

[[tool.importlinter.contracts]]
name = "gateway -> crawl -> egress -> spi"
type = "layers"
layers = ["agentpilot.gateway", "agentpilot.crawl", "agentpilot.egress", "agentpilot.spi"]

[[tool.importlinter.contracts]]
name = "jobs -> crawl -> egress -> spi"
type = "layers"
layers = ["agentpilot.jobs", "agentpilot.crawl", "agentpilot.egress", "agentpilot.spi"]

[[tool.importlinter.contracts]]
name = "jobs -> session -> identity -> spi"
type = "layers"
layers = ["agentpilot.jobs", "agentpilot.session", "agentpilot.identity", "agentpilot.spi"]

[[tool.importlinter.contracts]]
name = "jobs -> webhook -> egress -> spi"
type = "layers"
layers = ["agentpilot.jobs", "(agentpilot.webhook)", "agentpilot.egress", "agentpilot.spi"]

[[tool.importlinter.contracts]]
name = "jobs -> placement -> spi"
type = "layers"
layers = ["agentpilot.jobs", "agentpilot.placement", "agentpilot.spi"]

# "control/webhook never import driver" is still deferred until those future
# packages exist -- `forbidden` contracts, unlike `layers`, have no
# optional-module syntax and error hard on a missing module. session.py,
# identity.py, jobs, and now crawl are real, so their forbidden-import rules
# are live. agentpilot.webhook isn't added here yet for the same reason --
# it doesn't exist until a later phase of this feature build; add it to
# source_modules once it does.

[[tool.importlinter.contracts]]
name = "only the composition root imports the concrete driver"
type = "forbidden"
source_modules = [
    "agentpilot.gateway.routes",
    "agentpilot.gateway.schemas",
    "agentpilot.gateway.app",
    "agentpilot.session",
    "agentpilot.identity",
    "agentpilot.auth",
    "agentpilot.jobs",
    "agentpilot.crawl",
]
forbidden_modules = ["agentpilot.driver"]
# routes/app reach the driver only *through* agentpilot.gateway.wiring (the
# composition root) -- that's the intended indirection, so only a *direct*
# `import agentpilot.driver` from these modules should trip this contract.
allow_indirect_imports = true
