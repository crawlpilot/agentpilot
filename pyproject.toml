[tool.uv.workspace]
members = ["packages/*"]

# The workspace root is not a package. `crawlpilot` (the browser platform) and
# `agentpilot` (the multi-tenant service built on it) are separate projects with
# separate versions, wheels and CI jobs; this file only ties them together for
# local development.
#
# PyPI already hosts an unrelated `browserpilot`, which is why the browser layer
# is named `crawlpilot` -- see docs/browser-module-rearchitecture-plan.md 3.1.

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-httpserver>=1.1",
    "fakeredis>=2.26",
    "lupa>=2.1",
    "lxml-stubs>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/crawlpilot/tests", "packages/agentpilot-client/tests", "tests"]
markers = [
    "browser: drives a real browser (opt in with `-m browser`)",
]
# The real-browser suite is deselected by default. CI job 1 runs
# `packages/crawlpilot/tests` in a clean venv to prove the standalone wheel
# works, and that venv has no Chrome -- so the browser tests have to be opt-in
# to live in that directory at all, which is where they belong: they are the
# standalone library's own tests.
addopts = "-m 'not browser'"
# Two suites: crawlpilot's own (which must pass with only crawlpilot installed --
# CI job 1 runs it in a clean venv) and agentpilot's, which additionally covers
# the platform's implementations of crawlpilot's seams.

[tool.ruff]
line-length = 100
target-version = "py312"
# Source roots, so isort knows `crawlpilot` and `agentpilot` are first-party.
# Without this the Phase 7 move silently reclassified every internal import as
# third-party and produced ~100 spurious I001s. The only addition to this
# section -- the rule selection below is the pre-split configuration verbatim.
src = ["packages/crawlpilot/src", "packages/agentpilot", "packages/agentpilot-client/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's `Depends(...)` in argument defaults is the framework's own
# dependency-injection idiom, not the mutable-default-argument bug B008 exists
# to catch -- false positive on every route in agentpilot.gateway.routes.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = false
mypy_path = "packages/crawlpilot/src:packages/agentpilot:packages/agentpilot-client/src"

# The single owner of mypy strictness for both projects. `packages/agentpilot/
# pyproject.toml` used to carry its own duplicated `[[tool.mypy.overrides]]`
# blocks with no `[tool.mypy]` table above them -- orphans mypy never read,
# still naming `agentpilot.spi`/`driver`/`identity`/`session`, none of which
# have existed since the crawlpilot extraction. They are gone; this is the list.
#
# `agentpilot.control` is the platform's implementation of crawlpilot's
# injectable seams (registry, prototypes, proxy config, identity) -- the code on
# the far side of a Protocol boundary is exactly where a type error is most
# expensive, and it was already clean, so it costs nothing to hold it here.
[[tool.mypy.overrides]]
module = [
    "crawlpilot.*",
    "agentpilot.auth.*",
    "agentpilot.jobs.*",
    "agentpilot.crawl.*",
    "agentpilot.control.*",
]
strict = true

# `anthropic` ships with the optional `bedrock` extra, so a dev env synced
# without it must still typecheck agentpilot.llm.bedrock's guarded import.
[[tool.mypy.overrides]]
module = ["anthropic.*"]
ignore_missing_imports = true
