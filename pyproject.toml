[project]
name = "baas-crawlpilot"
version = "0.1.0"
description = "Multi-tenant Browser-as-a-Service platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "prometheus-client>=0.21",
    "structlog>=24.4",
    "redis>=5.0",
    "httpx>=0.27",
    "websockets>=13.0",
]

[project.optional-dependencies]
# Chrome-adjacent packages -- only ever imported by baas.driver,
# baas.extraction, and baas.identity.vault's Fernet encryption. Needed by
# `BAAS_ROLE=worker` (and `monolith`, run outside Docker) -- never installed
# in docker/gateway.Dockerfile's image, which is the whole point of the
# split (a genuinely Chrome-free gateway image).
driver = [
    "patchright>=1.61.2",
    "re-cdp-patches>=0.9.1",
    "trafilatura>=2.1.0",
    "cryptography>=43.0",
]
# Postgres driver (runtime pool) + Alembic (migrations) for baas.auth
# .store.PostgresApiKeyStore. Needed by `monolith`/`gateway` (both mount
# tenant-facing auth-gated routes) -- not `worker`, which never touches
# wiring.api_keys.
postgres = [
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.13",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-httpserver>=1.1",
    "fakeredis>=2.26",
    "lupa>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["baas"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's `Depends(...)` in argument defaults is the framework's own
# dependency-injection idiom, not the mutable-default-argument bug B008 exists
# to catch -- false positive on every route in baas.gateway.routes.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = false

[[tool.mypy.overrides]]
module = ["baas.spi.*", "baas.driver.*", "baas.identity.*", "baas.session.*", "baas.auth.*"]
strict = true

[tool.importlinter]
root_package = "baas"

# baas.placement/control are still P3+/future packages that don't exist yet
# -- wrapped in parentheses per import-linter's "optional layer" syntax so
# these contracts are already correct once those packages land, without
# breaking `lint-imports` today. baas.session landed in P1 and baas.identity
# lands in P2, so neither is parenthesized anymore.
[[tool.importlinter.contracts]]
name = "gateway -> session -> identity -> auth -> spi"
type = "layers"
layers = ["baas.gateway", "baas.session", "baas.identity", "baas.auth", "baas.spi"]

[[tool.importlinter.contracts]]
name = "gateway -> placement -> spi"
type = "layers"
layers = ["baas.gateway", "(baas.placement)", "baas.spi"]

[[tool.importlinter.contracts]]
name = "gateway -> control -> spi"
type = "layers"
layers = ["baas.gateway", "(baas.control)", "baas.spi"]

[[tool.importlinter.contracts]]
name = "driver -> {extraction, egress} -> spi"
type = "layers"
layers = ["baas.driver", "baas.extraction | baas.egress", "baas.spi"]

# "control/placement never import driver" is still deferred until those
# future packages exist -- `forbidden` contracts, unlike `layers`, have no
# optional-module syntax and error hard on a missing module. session.py and
# identity.py are real now, so their forbidden-import rules are live.

[[tool.importlinter.contracts]]
name = "only the composition root imports the concrete driver"
type = "forbidden"
source_modules = [
    "baas.gateway.routes",
    "baas.gateway.schemas",
    "baas.gateway.app",
    "baas.session",
    "baas.identity",
    "baas.auth",
]
forbidden_modules = ["baas.driver"]
# routes/app reach the driver only *through* baas.gateway.wiring (the
# composition root) -- that's the intended indirection, so only a *direct*
# `import baas.driver` from these modules should trip this contract.
allow_indirect_imports = true
