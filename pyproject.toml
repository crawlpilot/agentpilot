[tool.uv.workspace]
members = ["packages/*"]

# The workspace root is not a package. `crawlpilot` (the browser platform) and
# `agentpilot` (the multi-tenant service built on it) are separate projects with
# separate versions, wheels and CI jobs; this file only ties them together for
# local development.
#
# PyPI already hosts an unrelated `browserpilot`, which is why the browser layer
# is named `crawlpilot` -- see docs/browser-module-rearchitecture-plan.md 3.1.

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-httpserver>=1.1",
    "fakeredis>=2.26",
    "lupa>=2.1",
    "lxml-stubs>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PL", "RUF", "S", "BLE", "SLF"]
ignore = ["S101", "PLR0913", "PLR2004", "PLR0912", "PLR0915", "PLR0911", "S311", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "SLF", "PLR"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
mypy_path = "packages/crawlpilot/src:packages/agentpilot"
