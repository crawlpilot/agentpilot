[project]
name = "crawlpilot"
version = "0.2.0"
description = "An embeddable browser platform: navigation, interaction, stealth, proxies, profiles and markdown extraction, usable as a library."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Rahul Bisht", email = "rahulbisht1694@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]

# Base install: no browser, no framework. Enough to drive the HTTP fast-path
# tier and run the content pipeline. `httpx[http2]` pulls `h2` because Chrome
# always negotiates HTTP/2, and an HTTP/1.1-only ALPN offer from a client
# claiming to be Chrome is a standalone tell.
dependencies = [
    "httpx[http2]>=0.27",
    "brotli>=1.1",
    "zstandard>=0.22",
    "pydantic>=2.9",
    "structlog>=24.4",
    # The content pipeline, which the base install claims to provide and which
    # both consumers import at module level (`driver/patchright_driver.py`,
    # `session/http_fetch.py` -> `extraction/*`). These were an optional
    # `markdown` extra, which made `pip install crawlpilot` followed by reading
    # any page fail with `ModuleNotFoundError: lxml` -- the extra described an
    # optionality the imports never had.
    "lxml>=6.1.1",
    "cssselect>=1.2.0",
]

[project.optional-dependencies]
# Real Chrome. Deliberately optional, and genuinely so: a Chrome-free deployment
# installs crawlpilot without this and the driver is never imported
# (`api.Browser` builds it lazily, on first use).
engine = ["patchright>=1.61.2", "re-cdp-patches>=0.9.1"]
# Encryption-at-rest for saved browser profiles.
vault = ["cryptography>=43.0"]
# PDF text extraction (`extraction/pdf.py`). Optional and genuinely so: the import
# is guarded, and a deployment that never scrapes a PDF gets a descriptive
# `Document.error` rather than an ImportError at startup. Kept out of the base
# install because the base install's promise is "no browser, no framework" and a
# document parser is neither.
pdf = ["pypdf>=5.1"]
all = [
    "patchright>=1.61.2",
    "re-cdp-patches>=0.9.1",
    "cryptography>=43.0",
    "pypdf>=5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crawlpilot"]

# `root_package` is this project alone: import-linter cannot span two root
# packages, so the cross-project rule ("agentpilot may only import crawlpilot's
# published API") is enforced by a test in agentpilot's suite instead.
[tool.importlinter]
root_package = "crawlpilot"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "crawlpilot never imports the platform"
type = "forbidden"
source_modules = ["crawlpilot"]
forbidden_modules = ["agentpilot", "fastapi", "starlette", "psycopg", "prometheus_client", "redis"]

[[tool.importlinter.contracts]]
name = "tiers, config and policy are pure leaves"
type = "forbidden"
source_modules = ["crawlpilot.tiers", "crawlpilot.config"]
forbidden_modules = [
    "crawlpilot.spi",
    "crawlpilot.driver",
    "crawlpilot.session",
    "crawlpilot.identity",
    "crawlpilot.egress",
    "crawlpilot.extraction",
    "crawlpilot.dom",
    "crawlpilot.extensions",
    "crawlpilot.tools",
]

[[tool.importlinter.contracts]]
name = "only the facade imports the concrete driver"
type = "forbidden"
source_modules = [
    "crawlpilot.session",
    "crawlpilot.identity",
    "crawlpilot.extraction",
    "crawlpilot.dom",
    "crawlpilot.tools",
    "crawlpilot.policy",
    "crawlpilot.wire",
]
forbidden_modules = ["crawlpilot.driver"]
allow_indirect_imports = true

# `wire` is *serialization*, not transport. It is the one module both this
# library and a remote client import in order to agree on a shape, which is
# exactly why it must never grow an opinion about how that shape travels: the
# moment it imports an HTTP client or a web framework, every consumer of the
# shape acquires one too -- and the reason a client can depend on crawlpilot
# without taking on a server's dependency closure is gone.
#
# `crawlpilot.dom` is forbidden for the same reason in miniature: `to_wire`
# takes the tree serializer as an argument precisely so that *decoding* a reply
# does not drag in the DOM pipeline.
[[tool.importlinter.contracts]]
name = "wire serializes, it does not transport"
type = "forbidden"
source_modules = ["crawlpilot.wire", "crawlpilot._modelgen"]
forbidden_modules = ["httpx", "fastapi", "starlette", "crawlpilot.dom", "crawlpilot.driver"]
