[alembic]
script_location = alembic
prepend_sys_path = .
# No hardcoded URL -- alembic/env.py overrides this from AGENTPILOT_DATABASE_URL
# at runtime, so this file never encodes a real connection string in
# version control and always targets whatever Postgres the caller intends.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
